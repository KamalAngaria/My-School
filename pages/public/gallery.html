<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - East Point Public Senior Secondary School</title>
    <meta name="description" content="A curated collection presenting approved views and official moments of our esteemed institution.">
    
    <link rel="stylesheet" href="/styles/tokens.css">
    <link rel="stylesheet" href="/styles/typography.css">
    <link rel="stylesheet" href="/styles/base.css">
    <link rel="stylesheet" href="/styles/components/header.css">
    <link rel="stylesheet" href="/styles/components/footer.css">
    <link rel="stylesheet" href="/styles/pages/gallery.css">
    
    </head>
<body>

    <div id="global-header"></div>

    <main class="gallery-main container">
        <!-- Page Intro -->
        <header class="gallery-intro">
            <h1 class="font-headline-md text-display-lg text-primary">Gallery</h1>
            <p class="font-body-lg text-body-lg text-on-surface-variant">A curated collection presenting approved views and official moments of our esteemed institution.</p>
        </header>

        <!-- Section 1: School Building -->
        <section class="gallery-section">
            <div class="gallery-section__header">
                <i class="icon EP-ICON-BANK icon-fill text-secondary" aria-hidden="true"></i>
                <h2 class="font-headline-sm text-headline-md text-primary">School Building</h2>
            </div>
            <div class="gallery-grid gallery-grid--building">
                <div class="gallery-img-container aspect-4-3">
                    <img src="/assets/images/EP-IMG-003.webp" alt="School Building Exterior" loading="lazy">
                </div>
                <div class="gallery-img-container aspect-4-3">
                    <img src="/assets/images/EP-IMG-004.webp" alt="Campus Grounds" loading="lazy">
                </div>
                <div class="gallery-img-container aspect-4-3">
                    <img src="/assets/images/EP-IMG-005.webp" alt="Main Entrance" loading="lazy">
                </div>
                <div class="gallery-img-container aspect-21-9 col-span-full">
                    <img src="/assets/images/EP-IMG-006.webp" alt="Library Exterior" loading="lazy">
                </div>
            </div>
        </section>

        <!-- Section 2: School Office -->
        <section class="gallery-section">
            <div class="gallery-section__header">
                <i class="icon EP-ICON-WORK icon-fill text-secondary" aria-hidden="true"></i>
                <h2 class="font-headline-sm text-headline-md text-primary">School Office</h2>
            </div>
            <div class="gallery-grid gallery-grid--office">
                <div class="gallery-img-container aspect-square">
                    <img src="/assets/images/EP-IMG-007.webp" alt="Reception Area" loading="lazy">
                </div>
                <div class="gallery-img-container aspect-square col-span-md-2">
                    <img src="/assets/images/EP-IMG-008.webp" alt="Principal's Office" loading="lazy">
                </div>
                <div class="gallery-img-container aspect-video col-span-full">
                    <img src="/assets/images/EP-IMG-009.webp" alt="Staff Collaboration Space" loading="lazy">
                </div>
            </div>
        </section>

        <!-- Section 3: Exam Hall -->
        <section class="gallery-section">
            <div class="gallery-section__header">
                <i class="icon EP-ICON-DOCUMENT icon-fill text-secondary" aria-hidden="true"></i>
                <h2 class="font-headline-sm text-headline-md text-primary">Exam Hall</h2>
            </div>
            <div class="gallery-grid gallery-grid--exam">
                <div class="gallery-img-container aspect-video">
                    <img src="/assets/images/EP-IMG-010.webp" alt="Exam Hall Rows" loading="lazy">
                </div>
                <div class="gallery-img-container aspect-video">
                    <img src="/assets/images/EP-IMG-011.webp" alt="Individual Exam Desk" loading="lazy">
                </div>
            </div>
        </section>
    </main>

    <div id="global-footer"></div>
    <script src="/scripts/core/layout-injector.js"></script>
</body>
</html>
