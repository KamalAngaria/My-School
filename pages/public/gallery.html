<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - East Point Public Senior Secondary School</title>
    <meta name="description" content="A curated collection presenting approved views and official moments of our esteemed institution.">
    
    <link rel="stylesheet" href="/styles/tokens.css">
    <link rel="stylesheet" href="/styles/typography.css">
    <link rel="stylesheet" href="/styles/base.css">
    <link rel="stylesheet" href="/styles/components/header.css">
    <link rel="stylesheet" href="/styles/components/footer.css">
    <link rel="stylesheet" href="/styles/pages/gallery.css">
    <!-- Favicon: all formats for maximum browser compatibility -->
    <link rel="icon" type="image/x-icon" href="/assets/icons/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="/assets/icons/favicon-48x48.png">
    <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
    
        <link rel="preload" href="/assets/fonts/urbanist/Urbanist-Variable.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/assets/fonts/paytone-one/PaytoneOne-Regular.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>

    <div id="global-header"></div>

    <main class="gallery-main container">
        <!-- Page Intro -->
        <header class="gallery-intro">
            <h1 class="font-headline-md text-display-lg text-primary">Gallery</h1>
            <p class="font-body-lg text-body-lg text-on-surface-variant">A curated collection presenting approved views and official moments of our esteemed institution.</p>
        </header>

        <!-- Section 1: School Building -->
        <section class="gallery-section">
            <div class="gallery-section__header">
                <i class="icon EP-ICON-BANK icon-fill text-secondary" aria-hidden="true"></i>
                <h2 class="font-headline-sm text-headline-md text-primary">School Building</h2>
            </div>
            <div class="gallery-grid gallery-grid--building">
                <div class="gallery-img-container">
                    <img height="279" width="512" src="/assets/images/EP-IMG-003.webp" alt="School Building Exterior" loading="lazy">
                </div>
                <div class="gallery-img-container">
                    <img height="279" width="512" src="/assets/images/EP-IMG-004.webp" alt="Campus Grounds" loading="lazy">
                </div>
                <div class="gallery-img-container">
                    <img height="279" width="512" src="/assets/images/EP-IMG-005.webp" alt="Main Entrance" loading="lazy">
                </div>
                <div class="gallery-img-container">
                    <img height="279" width="512" src="/assets/images/EP-IMG-006.webp" alt="Library Exterior" loading="lazy">
                </div>
            </div>
        </section>

        <!-- Section 2: School Office -->
        <section class="gallery-section">
            <div class="gallery-section__header">
                <i class="icon EP-ICON-WORK icon-fill text-secondary" aria-hidden="true"></i>
                <h2 class="font-headline-sm text-headline-md text-primary">School Office</h2>
            </div>
            <div class="gallery-grid gallery-grid--office">
                <div class="gallery-img-container">
                    <img height="279" width="512" src="/assets/images/EP-IMG-007.webp" alt="Reception Area" loading="lazy">
                </div>
                <div class="gallery-img-container">
                    <img height="279" width="512" src="/assets/images/EP-IMG-008.webp" alt="Principal's Office" loading="lazy">
                </div>
                <div class="gallery-img-container">
                    <img height="279" width="512" src="/assets/images/EP-IMG-009.webp" alt="Staff Collaboration Space" loading="lazy">
                </div>
            </div>
        </section>

        <!-- Section 3: Exam Hall -->
        <section class="gallery-section">
            <div class="gallery-section__header">
                <i class="icon EP-ICON-DOCUMENT icon-fill text-secondary" aria-hidden="true"></i>
                <h2 class="font-headline-sm text-headline-md text-primary">Exam Hall</h2>
            </div>
            <div class="gallery-grid gallery-grid--exam">
                <div class="gallery-img-container">
                    <img height="279" width="512" src="/assets/images/EP-IMG-010.webp" alt="Exam Hall Rows" loading="lazy">
                </div>
                <div class="gallery-img-container">
                    <img height="279" width="512" src="/assets/images/EP-IMG-011.webp" alt="Individual Exam Desk" loading="lazy">
                </div>
            </div>
        </section>
    </main>

    <div id="global-footer"></div>
    <script src="/scripts/core/layout-injector.js" defer></script>
</body>
</html>
